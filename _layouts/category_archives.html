---
layout: default
---
<h1 class="chapter-title">{{ page.type | capitalize }}: {{ page.title | escape }}</h1>
{% include archive_list.html posts=page.posts %}
{% if page.type == 'tag' %}
  <p><a href="{{ '/tags/' | relative_url }}">All tags &raquo;</a></p>
{% else %}
  <p><a href="{{ '/archives/' | relative_url }}">All archives &raquo;</a></p>
{% endif %}
