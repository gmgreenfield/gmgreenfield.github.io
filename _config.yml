title: Graham Greenfield
email: grahamg@gmail.com
description: >-
  A software development blog and notes on technology.
baseurl: ""
url: "https://gmgreenfield.github.io"
lang: en-US

theme: jekyll-whiteglass
plugins:
  - jekyll-archives
  - jekyll-paginate
  - jekyll-sitemap

permalink: /:year/:month/:day/:title/
paginate_path: /posts/:num/
paginate: 5

jekyll-archives:
  enabled:
    - categories
    - tags
  layout: category_archives
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - .bundle/
  - .git/
  - .github/
