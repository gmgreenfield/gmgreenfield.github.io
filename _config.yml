title: Graham Greenfield
author: Graham Greenfield
email: grahamg@gmail.com
description: >-
  A personal blog about software development, technology, misc. notes and occasionally some outside topics.
baseurl: ""
url: "https://grahamg.xyz"
lang: en-US

# The Proportional Web-inspired theme lives in _layouts, _includes, and assets.
plugins:
  - jekyll-archives
  - jekyll-paginate
  - jekyll-sitemap

permalink: /:year/:month/:day/:title/
paginate_path: /posts/:num/
paginate: 5

jekyll-archives:
  enabled:
    - categories
    - tags
  layout: category_archives
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - .bundle/
  - .git/
  - .github/
