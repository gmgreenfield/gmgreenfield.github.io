{% if paginator.total_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if paginator.previous_page %}<a href="{{ paginator.previous_page_path | relative_url }}" rel="prev">&laquo; Newer posts</a>{% endif %}
  <span>Page {{ paginator.page }} of {{ paginator.total_pages }}</span>
  {% if paginator.next_page %}<a href="{{ paginator.next_page_path | relative_url }}" rel="next">Older posts &raquo;</a>{% endif %}
</nav>
{% endif %}
