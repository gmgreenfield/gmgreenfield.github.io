<header class="site-header">
  {% if page.layout == 'home' %}
    <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.author | escape }}</a></h1>
  {% else %}
    <p class="site-title"><a href="{{ '/' | relative_url }}">{{ site.author | escape }}</a></p>
  {% endif %}
  <nav class="site-nav" aria-label="Main navigation">
    <a href="{{ '/' | relative_url }}"{% if page.layout == 'home' %} aria-current="page"{% endif %}>Home</a>
    {% for item in site.data.navigation.main %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title | escape }}</a>
    {% endfor %}
  </nav>
</header>
